data:
  images_path: "../data/animals"
  captions_path: "../data/dataset_captions.json"

model:
  text_encoder: "distilbert-base-uncased"
  embedding_dim: 256
  max_text_length: 32

training:
  device: "mps"
  batch_size: 32
  samples_per_class: 2
  learning_rate_head: 0.0001
  learning_rate_backbone: 0.00005
  weight_decay_backbone: 0.01
  weight_decay_head: 0.0001
  epochs: 10
  epochs_f2: 5

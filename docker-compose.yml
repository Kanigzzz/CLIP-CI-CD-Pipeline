services:
  api:
    build:
      context: .
      dockerfile: docker/Dockerfile.api
    restart: unless-stopped
    environment:
      - HF_TOKEN=${HF_TOKEN}
      - MODEL_REVISION=@{MODEL_REVISION}
    volumes:
      - hf_cache:/app/.cache/huggingface
      - models_data:/app/models
      - animals_data:/app/data
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/ready')\" || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks:
      - private_net

  frontend:
    build:
      context: .
      dockerfile: docker/Dockerfile.frontend
    restart: unless-stopped
    networks:
      - private_net
    depends_on:
      api:
        condition: service_healthy

  proxy:
    image: nginx:alpine
    ports: 
      - 80:80
    volumes:
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    restart: unless-stopped
    networks:
      - private_net
      - public_net
    depends_on:
      api:
        condition: service_healthy
      frontend:
        condition: service_started

volumes:
  hf_cache:
  models_data: 
  animals_data:

networks:
  public_net:
    driver: bridge
  private_net:
    internal: true
services:
  api:
    build:
      context: .
      dockerfile: docker/Dockerfile.api
    restart: unless-stopped
    environment:
      - HF_TOKEN=${HF_TOKEN}
      - MODEL_REVISION=${MODEL_REVISION}
    volumes:
      - hf_cache:/app/.cache/huggingface
      - models_data:/app/models
      - animals_data:/app/data
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    networks:
      - private_net
      - egress_net

  frontend:
    build:
      context: .
      dockerfile: docker/Dockerfile.frontend
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETUID
      - SETGID
      - NET_BIND_SERVICE
    networks:
      - private_net

  proxy:
    image: nginx:alpine
    ports:
      - 80:80
    volumes:
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETUID
      - SETGID
      - NET_BIND_SERVICE
    networks:
      - private_net
      - public_net
    depends_on:
      api:
        condition: service_healthy
      frontend:
        condition: service_started

volumes:
  hf_cache:
  models_data:
  animals_data:

networks:
  public_net:
    driver: bridge
  private_net:
    internal: true
  egress_net:
    driver: bridge
services:
  api:
    build:
      context: .
      dockerfile: docker/Dockerfile.api
    restart: unless-stopped
    environment:
      - HF_TOKEN=${HF_TOKEN}
    volumes:
      - hf_cache:/app/.cache/huggingface
      - models_data:/app/models
      - animals_data:/app/data

  frontend:
    build:
      context: .
      dockerfile: docker/Dockerfile.frontend
    restart: unless-stopped
    depends_on:
      - api

  
  proxy:
    image: nginx:alpine
    ports: 
      - 80:80
    volumes:
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - api
      - frontend
    restart: unless-stopped


volumes:
  hf_cache:
  models_data: 
  animals_data: